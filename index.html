<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <title>ইলমি দ্বীন</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

<!-- Header -->
  <div class="bg-danger text-white p-2">
  🔴 ব্রেকিং: হজ্জ নিবন্ধন শুরু হয়েছে
</div>
<div id="header"></div>



<!-- Main Content -->
<div class="container mt-4">
  <div class="row">

    <!-- Left Content -->
    <div class="col-md-8">

      <!-- Featured Post -->
      <div class="card mb-4 shadow-sm">
        <img src="assets/img/hajj.jpg" class="card-img-top">
        <div class="card-body">
          <h4>হজ্জ গাইড: কুরআন ও সুন্নাহ মোতাবেক</h4>
          <p>হজ্জ সম্পর্কে বিস্তারিত আলোচনা এবং নির্দেশনা...</p>
        </div>
      </div>

      <!-- News List -->
      <div class="row">

        <div class="col-md-6">
          <div class="card mb-3">
            <img src="assets/img/zakat.jpg" class="card-img-top">
            <div class="card-body">
              <h6>যাকাত: গুরুত্ব ও বিধান</h6>
            </div>
          </div>
        </div>

        <div class="col-md-6">
          <div class="card mb-3">
            <img src="assets/img/ramadan.jpg" class="card-img-top">
            <div class="card-body">
              <h6>রামাদান প্রস্তুতি</h6>
            </div>
          </div>
        </div>

      </div>

    </div>

    <!-- Sidebar -->
    <div class="col-md-4">
      <div id="sidebar"></div>

      <!-- Extra Widget -->
      <div class="card mt-3">
        <img src="assets/img/island.jpg" class="card-img-top">
        <div class="card-body">
          <h6>সালাত: সর্বোত্তম ইবাদত</h6>
        </div>
      </div>

    </div>

  </div>
</div>

<!-- CTA Section -->
<section class="bg-light mt-5 py-4 text-center">
  <h5>📢 প্রতিদিন রাত ৮:৩০ মিনিটে অনলাইন ক্লাস</h5>
  <button class="btn btn-success mt-2">Zoom লিংক</button>
  <button class="btn btn-outline-success mt-2">WhatsApp গ্রুপ</button>
</section>

<!-- Footer -->
<div id="footer"></div>

<script src="includes/loader.js"></script>

</body>
</html>
